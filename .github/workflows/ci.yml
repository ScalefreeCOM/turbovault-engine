name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Format with Black
      run: |
        black backend/ -v

    - name: Auto-Commit Formatting Fixes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "style: auto-format code with Black"
        commit_options: '--no-verify'
        file_pattern: 'backend/**/*.py'

    - name: Lint with Ruff
      run: |
        ruff check backend/
      continue-on-error: true

    - name: Type check with mypy (warnings only)
      run: |
        mypy backend/engine backend/turbovault || true
      continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Django migrations
      run: |
        cd backend
        python manage.py migrate --noinput

    - name: Run tests with pytest
      run: |
        python -m pytest backend/tests/ -v --tb=short

    - name: Test CLI commands (smoke test)
      run: |
        turbovault --help
        turbovault --version || true

  dbt-round-trip:
    name: dbt round trip
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # dbt in a virtualenv of its own: the Engine doesn't depend on it.
    # dbt parse needs an adapter, but no database.
    - name: Install dbt
      run: |
        python -m venv /tmp/dbt-venv
        /tmp/dbt-venv/bin/pip install "dbt-core>=1.10,<2" dbt-postgres

    - name: Run Django migrations
      run: |
        cd backend
        python manage.py migrate --noinput

    # Generate the TPC-H sample, dbt parse it, import the manifest, generate
    # again and compare; also generate the import back into the parsed dbt
    # project (spec §12, D17). dbt deps downloads datavault4dbt.
    - name: Round trip
      env:
        TURBOVAULT_DBT: /tmp/dbt-venv/bin/dbt
      run: |
        python -m pytest backend/tests/imports/dbt/test_round_trip.py -v --tb=short

  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        pip install twine
        twine check dist/*

    - name: Smoke test installed wheel
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install dist/*.whl
        cd /tmp
        DJANGO_SETTINGS_MODULE=turbovault.settings /tmp/wheel-venv/bin/python -c "import django; django.setup(); import engine.services.generation"
        /tmp/wheel-venv/bin/turbovault --help

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/
